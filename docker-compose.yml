# Local PostgreSQL for development only.
#   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lnd
      POSTGRES_PASSWORD: lnd_dev_password
      POSTGRES_DB: lnd
    ports:
      - "5432:5432"
    volumes:
      - lnd_pgdata:/var/lib/postgresql/data

volumes:
  lnd_pgdata:
